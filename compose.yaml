name: guidejung-data
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      APP_ENV: production
      DATA_MODE: live
    volumes:
      - guidejung_runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
# The trip website is a static export served by Cloudflare Workers (wrangler.jsonc), not a container.
volumes:
  guidejung_runtime:
