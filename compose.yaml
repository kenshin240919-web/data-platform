name: guidejung-data
services:
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file: .env
    environment:
      APP_ENV: production
      DATA_MODE: live
    volumes:
      - guidejung_runtime:/app/runtime
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  trip:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        APP: trip
    environment:
      INTERNAL_API_URL: http://api:8100
      TRIP_PUBLIC_URL: https://trip.guidejung.com
      SEO_ENABLED: ${SEO_ENABLED:-false}
      DATA_MODE: live
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    volumes: ["./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "guidejung_tls:/data"]
    depends_on: [trip]
    restart: unless-stopped
volumes:
  guidejung_tls:
  guidejung_runtime:
