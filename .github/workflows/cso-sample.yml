name: CSO sample
# One-off: 민원실 실시간 대기 API 응답 구조 확인(scripts/cso-sample.py) → reports/civil/cso-sample.md 커밋.
on:
  push:
    branches: [main]
    paths: ['scripts/cso-sample.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/cso-sample.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/civil/cso-sample.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '민원실 실시간 대기 응답 확인'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
