name: GA check
# One-off: GA 서비스 계정 연결 시험(속성·측정 ID·Data API 응답 여부만, 숫자 출력 안 함).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-auth requests
      - name: Check
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: python scripts/ga-check.py
