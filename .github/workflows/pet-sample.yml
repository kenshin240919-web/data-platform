name: Pet sample
# One-off: 내근처 동물병원 설계용 표본(농림축산검역본부 구조동물·동물보호센터·분실동물 API). 항목·건수만 출력.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/pet-sample.py
