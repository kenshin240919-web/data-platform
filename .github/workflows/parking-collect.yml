name: Parking collect
# Daily parking list for parking.guidejung.com (내근처 주차장): 전국주차장정보표준데이터 (fees, hours, coordinates)
# (scripts/collect-parking.py). apps/parking/data/parkings.json is committed to main only when it changed
# (parking-deploy.yml deploys after this run).
# Secrets: DATA_GO_KR_KEY, KAKAO_REST_KEY (좌표 없는 곳만).
on:
  schedule:
    - cron: '37 19 * * *' # 04:37 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: parking-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/collect-parking.py
      - name: Commit parking list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/parking/data/parkings.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'parking: 주차장 목록 갱신'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
