name: Market deploy
# Deploys market.guidejung.com (Worker guidejung-market, 내근처 시장 — 온누리상품권 사용처) with wrangler from GitHub Actions.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, KAKAO_REST_KEY(가게 상세의 위치 찾기 — 방문 때마다 검색, 저장 안 함).
# 10/28 사용자 승인(첫 배포·도메인 연결) → push·매일 수집 후·수동.
on:
  push:
    branches: [main]
    paths:
      - 'apps/market/**'
      - 'apps/weather/data/**'
      - 'apps/traffic/data/**'
      - 'apps/oil/data/areas.json'
      - 'packages/**'
      - 'scripts/prune-rsc.mjs'
      - 'package.json'
      - 'package-lock.json'
  # 매일 목록 커밋은 GITHUB_TOKEN으로 push돼 push 이벤트가 안 생김 → 수집 작업이 끝나면 따로 배포.
  workflow_run:
    workflows: ['Market collect']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/market/wrangler.jsonc
      - name: Worker secrets
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: printf '%s' "$KAKAO_REST_KEY" | npx wrangler secret put KAKAO_REST_KEY -c apps/market/wrangler.jsonc
