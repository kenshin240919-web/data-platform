name: Market deploy
# Deploys market.guidejung.com (Worker guidejung-market, 내근처 시장 — 온누리상품권 사용처) with wrangler from GitHub Actions.
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, KAKAO_REST_KEY(가게 상세의 위치 찾기 — 방문 때마다 검색, 저장 안 함).
# 첫 배포·도메인 연결은 사용자 승인 뒤(10/27): 지금은 수동 실행만. 승인 후 push·매일 수집 후 배포를 켬.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/market/wrangler.jsonc
      - name: Worker secrets
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: printf '%s' "$KAKAO_REST_KEY" | npx wrangler secret put KAKAO_REST_KEY -c apps/market/wrangler.jsonc
