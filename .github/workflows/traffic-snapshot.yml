name: Traffic snapshot
# Daily highway routes, rest areas, food and fuel prices for traffic.guidejung.com (apps/traffic/data/).
# Needs the repository secret EX_API_KEY (한국도로공사 고속도로 공공데이터 포털 인증키). The commit to main makes Cloudflare redeploy.
on:
  schedule:
    - cron: '37 19 * * *' # 04:37 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: traffic-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect
        env:
          EX_API_KEY: ${{ secrets.EX_API_KEY }}
        run: python scripts/collect-traffic-snapshot.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/traffic/data
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'traffic: 고속도로·휴게소 스냅샷 갱신'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
