name: Civil collect
# Daily list for minwon.guidejung.com (내근처 서류): 무인민원발급기(운영 시간·서류)·주민센터·민원실(실시간 대기 44곳)·우체국·여권 기관
# (scripts/collect-civil.py). 발급기별 서류 원본은 runtime/civil/docs.json(Actions cache) — 처음엔 전체(약 5,300쪽), 이후 바뀐 줄만.
# apps/civil/data/places.json is committed to main only when it changed. Secrets: DATA_GO_KR_KEY, KAKAO_REST_KEY(좌표 없는 곳·30일 재확인).
on:
  schedule:
    - cron: '27 20 * * *' # 05:27 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/collect-civil.py]
permissions:
  contents: write
concurrency:
  group: civil-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - uses: actions/cache@v4
        with:
          path: runtime/civil
          key: civil-docs-${{ github.run_id }}
          restore-keys: civil-docs-
      - name: Collect
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect-civil.py
      - name: Commit civil list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/civil/data/places.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'civil: 민원·서류 장소 목록 갱신'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
