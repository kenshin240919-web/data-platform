name: Massage sample
# One-off: 내근처 마사지 설계용 표본(LOCALDATA 의료유사업·미용업·목욕장업 파일 + 의료유사업 API 응답). 통계·항목만 출력.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/massage-sample.py
