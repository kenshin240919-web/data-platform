name: Oil deploy
# Deploys oil.guidejung.com (Worker guidejung-oil) with wrangler from GitHub Actions (not connected to Cloudflare
# Workers Builds). Secrets: CLOUDFLARE_API_TOKEN (github-d1: Workers Scripts edit …), CLOUDFLARE_ACCOUNT_ID.
# 사용자 승인 전에는 수동 실행만(자동 배포 트리거는 승인 후 추가).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oil-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/oil/wrangler.jsonc
