name: GA weekly
# 매주 월요일 내근처 12개 사이트 GA4 주간 보고서(scripts/ga-weekly.py) → reports/ga/주간-YYYY-MM-DD.md main 커밋.
# 공개 저장소라 숫자가 공개됨(10/25 사용자 A안 승인). Secret: GA_SERVICE_ACCOUNT_JSON. 무료(GA Data API).
on:
  schedule:
    - cron: '13 23 * * 0' # 월요일 08:13 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ga-weekly
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q google-auth requests
      - name: Report
        env:
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: python scripts/ga-weekly.py
      - name: Commit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ga
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'GA 주간 보고서'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
