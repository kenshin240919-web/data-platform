name: Rest lookup
# One-off: 1인 목욕탕·세신샵이 공공데이터에 있는지 조회(휴식 설계용).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/rest-lookup.py
