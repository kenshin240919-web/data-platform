name: Clarity collect
# 매일 내근처 12개 Clarity 프로젝트의 최근 24시간 지표(scripts/collect-clarity.py, 프로젝트당 3회/한도 10회)
# → reports/clarity/raw/YYYY-MM-DD.json main 커밋. 공개 저장소(10/25 사용자 A안). Secrets: 사이트마다 CLARITY_TOKEN_{사이트}(11/10부터) + 예전 CLARITY_TOKENS. 무료.
on:
  schedule:
    - cron: '23 22 * * *' # 07:23 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clarity-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Collect
        env:
          CLARITY_TOKENS: ${{ secrets.CLARITY_TOKENS }}
          CLARITY_TOKEN_TRIP: ${{ secrets.CLARITY_TOKEN_TRIP }}
          CLARITY_TOKEN_WEATHER: ${{ secrets.CLARITY_TOKEN_WEATHER }}
          CLARITY_TOKEN_TRAFFIC: ${{ secrets.CLARITY_TOKEN_TRAFFIC }}
          CLARITY_TOKEN_CHARGE: ${{ secrets.CLARITY_TOKEN_CHARGE }}
          CLARITY_TOKEN_ACADEMY: ${{ secrets.CLARITY_TOKEN_ACADEMY }}
          CLARITY_TOKEN_SCHOOL: ${{ secrets.CLARITY_TOKEN_SCHOOL }}
          CLARITY_TOKEN_PHARMACY: ${{ secrets.CLARITY_TOKEN_PHARMACY }}
          CLARITY_TOKEN_HOSPITAL: ${{ secrets.CLARITY_TOKEN_HOSPITAL }}
          CLARITY_TOKEN_OIL: ${{ secrets.CLARITY_TOKEN_OIL }}
          CLARITY_TOKEN_PARKING: ${{ secrets.CLARITY_TOKEN_PARKING }}
          CLARITY_TOKEN_SERVICE: ${{ secrets.CLARITY_TOKEN_SERVICE }}
          CLARITY_TOKEN_NEAR: ${{ secrets.CLARITY_TOKEN_NEAR }}
          CLARITY_TOKEN_REST: ${{ secrets.CLARITY_TOKEN_REST }}
          CLARITY_TOKEN_PET: ${{ secrets.CLARITY_TOKEN_PET }}
          CLARITY_TOKEN_CIVIL: ${{ secrets.CLARITY_TOKEN_CIVIL }}
          CLARITY_TOKEN_MARKET: ${{ secrets.CLARITY_TOKEN_MARKET }}
          CLARITY_TOKEN_BENEFIT: ${{ secrets.CLARITY_TOKEN_BENEFIT }}
          CLARITY_TOKEN_JOB: ${{ secrets.CLARITY_TOKEN_JOB }}
          CLARITY_TOKEN_CVS: ${{ secrets.CLARITY_TOKEN_CVS }}
          CLARITY_TOKEN_MOVIE: ${{ secrets.CLARITY_TOKEN_MOVIE }}
          CLARITY_TOKEN_STOCK: ${{ secrets.CLARITY_TOKEN_STOCK }}
        run: python scripts/collect-clarity.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/clarity
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'Clarity 하루 지표'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
