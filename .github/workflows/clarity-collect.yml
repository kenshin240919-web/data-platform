name: Clarity collect
# 매일 내근처 12개 Clarity 프로젝트의 최근 24시간 지표(scripts/collect-clarity.py, 프로젝트당 3회/한도 10회)
# → reports/clarity/raw/YYYY-MM-DD.json main 커밋. 공개 저장소(10/25 사용자 A안). Secret: CLARITY_TOKENS. 무료.
on:
  schedule:
    - cron: '23 22 * * *' # 07:23 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: clarity-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests
      - name: Collect
        env:
          CLARITY_TOKENS: ${{ secrets.CLARITY_TOKENS }}
        run: python scripts/collect-clarity.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/clarity
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'Clarity 하루 지표'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
