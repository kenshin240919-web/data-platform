name: Benefit sample
# One-off: 공공서비스(혜택) 정보 표본(scripts/benefit-sample.py) → reports/benefit/sample.md 커밋. 내근처 혜택 설계용.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sample
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/benefit-sample.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/benefit/sample.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '공공서비스(혜택) 정보 표본'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
