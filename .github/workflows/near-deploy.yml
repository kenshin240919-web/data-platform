name: Near deploy
# Deploys near.guidejung.com (Worker guidejung-near, 내근처 모아보기) with wrangler from GitHub Actions (not connected to Cloudflare
# Workers Builds). Secrets: CLOUDFLARE_API_TOKEN (github-d1: Workers Scripts edit …), CLOUDFLARE_ACCOUNT_ID.
# Runs when the near app (or what it imports) changes on main, or by hand. No data of its own (live numbers come from the sister sites' APIs).
on:
  push:
    branches: [main]
    paths:
      - 'apps/near/**'
      - 'apps/weather/data/**'
      - 'apps/weather/lib/**'
      - 'apps/traffic/data/**'
      - 'apps/oil/data/areas.json'
      - 'packages/**'
      - 'scripts/prune-rsc.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: near-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/near/wrangler.jsonc
      # 공용 API(/api/blog 네이버 블로그 후기, /api/around 카카오 주변 장소)에 쓰는 키 — 값은 GitHub Secrets에만.
      - name: Worker secrets
        env:
          NAVER_HUB_CLIENT_ID: ${{ secrets.NAVER_HUB_CLIENT_ID }}
          NAVER_HUB_CLIENT_SECRET: ${{ secrets.NAVER_HUB_CLIENT_SECRET }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          for k in NAVER_HUB_CLIENT_ID NAVER_HUB_CLIENT_SECRET KAKAO_REST_KEY; do
            if [ -n "${!k}" ]; then printf '%s' "${!k}" | npx wrangler secret put "$k" -c apps/near/wrangler.jsonc; fi
          done
