name: Civil deploy
# Deploys minwon.guidejung.com (Worker guidejung-civil) with wrangler from GitHub Actions. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# DATA_GO_KR_KEY(민원실 실시간 대기), KAKAO_REST_KEY·NAVER_HUB_CLIENT_ID·NAVER_HUB_CLIENT_SECRET(무인 프린트 실시간 — 저장 안 함).
# 10/27 사용자 승인(배포·도메인 연결) → push·매일 수집 후·수동.
on:
  push:
    branches: [main]
    paths:
      - 'apps/civil/**'
      - 'apps/pharmacy/lib/fmt.ts'
      - 'apps/weather/data/**'
      - 'apps/traffic/data/**'
      - 'apps/oil/data/areas.json'
      - 'packages/**'
      - 'scripts/prune-rsc.mjs'
      - 'package.json'
      - 'package-lock.json'
  # 매일 목록 커밋은 GITHUB_TOKEN으로 push돼 push 이벤트가 안 생김 → 수집 작업이 끝나면 따로 배포.
  workflow_run:
    workflows: ['Civil collect']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: civil-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/civil/wrangler.jsonc
      - name: Worker secrets
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          NAVER_HUB_CLIENT_ID: ${{ secrets.NAVER_HUB_CLIENT_ID }}
          NAVER_HUB_CLIENT_SECRET: ${{ secrets.NAVER_HUB_CLIENT_SECRET }}
        run: |
          for k in DATA_GO_KR_KEY KAKAO_REST_KEY NAVER_HUB_CLIENT_ID NAVER_HUB_CLIENT_SECRET; do
            printf '%s' "${!k}" | npx wrangler secret put "$k" -c apps/civil/wrangler.jsonc
          done
