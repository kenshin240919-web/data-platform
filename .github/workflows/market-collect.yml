name: Market collect
# 온누리상품권 가맹점 목록 for market.guidejung.com (내근처 시장, scripts/collect-market.py):
# 소상공인시장진흥공단 '전국 온누리상품권 가맹점 현황' 파일(연 1회) + 전통시장 표준데이터(DATA_GO_KR_KEY, 활용신청 안 돼 있으면 건너뜀)
# + 시장·상점가 위치는 카카오 키워드 검색(KAKAO_REST_KEY, runtime/market/geo.json은 Actions cache, 30일마다 다시 확인).
# apps/market/data/market.json is committed to main only when it changed (market-deploy.yml deploys after this run).
on:
  schedule:
    - cron: '37 20 * * *' # 05:37 KST
  workflow_dispatch:
    inputs:
      force:
        description: '가맹점 수가 20% 넘게 줄어도 저장'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: market-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: runtime/market
          key: market-${{ github.run_id }}
          restore-keys: market-
      - name: Collect
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect-market.py ${{ inputs.force && '--force' || '' }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('runtime/market/geo.json') != ''
        with:
          path: runtime/market
          key: market-${{ github.run_id }}
      - name: Commit market list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/market/data/market.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'market: 온누리상품권 가맹점 목록 갱신'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
