name: NEIS academy sample
# One-off survey of the NEIS 학원교습소정보 API for reports/academy-설계안 (prints statistics only, commits nothing).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Survey
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python scripts/neis-academy-sample.py
