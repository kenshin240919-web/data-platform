name: Benefit deploy
# Deploys benefit.guidejung.com (Worker guidejung-benefit, 내근처 혜택 — 정부·지자체 지원금) with wrangler from GitHub Actions.
# 데이터(apps/benefit/data/benefits.json, 약 20MB)는 저장소에 두지 않고 배포할 때마다 새로 받음(scripts/collect-benefit.py, 약 33회 호출).
# Secrets: DATA_GO_KR_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# 10/28 사용자 승인(첫 배포·도메인 연결) → push·매일 05:47 KST·수동.
on:
  push:
    branches: [main]
    paths:
      - 'apps/benefit/**'
      - 'scripts/collect-benefit.py'
      - 'apps/weather/data/**'
      - 'apps/traffic/data/**'
      - 'apps/oil/data/areas.json'
      - 'packages/**'
      - 'scripts/prune-rsc.mjs'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '47 20 * * *'  # 매일 05:47 KST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: benefit-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect-benefit.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/benefit/wrangler.jsonc
