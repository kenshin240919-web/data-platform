name: Movie deploy
# Deploys movie.guidejung.com (Worker guidejung-movie) with wrangler from GitHub Actions (not connected to Cloudflare Workers
# Builds). Secrets: CLOUDFLARE_API_TOKEN (github-d1: Workers Scripts edit …), CLOUDFLARE_ACCOUNT_ID.
# Runs when the movie app (or what it imports) changes on main, after the daily list commit, or by hand. Secret KOBIS_API_KEY → Worker.
# 11/9 사용자 승인으로 첫 배포·도메인 연결.
on:
  push:
    branches: [main]
    paths:
      - 'apps/movie/**'
      - 'apps/weather/data/**'
      - 'apps/traffic/data/**'
      - 'packages/**'
      - 'scripts/prune-rsc.mjs'
      - 'package.json'
      - 'package-lock.json'
  # 매일 목록 커밋은 GITHUB_TOKEN으로 push돼 push 이벤트가 안 생김 → 수집 작업이 끝나면 따로 배포.
  workflow_run:
    workflows: ['Movie collect']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: movie-deploy
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/movie/wrangler.jsonc
      - name: Worker secret (KOBIS 오픈API — 박스오피스, 방문 때만 조회)
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
        run: printf '%s' "$KOBIS_API_KEY" | npx wrangler secret put KOBIS_API_KEY -c apps/movie/wrangler.jsonc
