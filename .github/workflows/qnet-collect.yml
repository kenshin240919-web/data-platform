name: Q-net collect
# 큐넷 국가자격 시험장(scripts/collect-qnet.py) → apps/job/data/qnet-areas.json. 큐넷이 해외에서 자주 끊겨 매시간 못 받은 지사만 다시 시도
# (모두 7일 안이면 몇 초 만에 끝). 새로 받은 지사가 있으면 일자리 수집(job-collect.yml)을 돌려 시험장 목록·배포까지 이어감.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/collect-qnet.py]
permissions:
  contents: write
  actions: write
concurrency:
  group: qnet-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect
        id: c
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python scripts/collect-qnet.py | tee out.log
          echo "new=$(grep -oP '^NEW \K\d+' out.log || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Commit
        if: steps.c.outputs.new != '0'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/job/data/qnet-areas.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'job: 국가자격 시험장 원본 갱신'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 10; done
      - name: Run job collect
        if: steps.c.outputs.new != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run job-collect.yml --ref main
