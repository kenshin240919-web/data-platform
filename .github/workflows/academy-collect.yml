name: Academy collect
# Daily collection for academy.guidejung.com (내근처 학원): NEIS 학원교습소정보 + Kakao 주소→좌표 (scripts/collect-academy.py).
# runtime/academy (full.json, geo.json = address cache) is kept in the Actions cache so only new addresses are geocoded.
# Then: D1 guidejung-academy gets new/changed rows (scripts/build-academy-d1.mjs) and the small build file
# apps/academy/data/summary.json is committed to main (Cloudflare rebuilds the static pages).
# Secrets: NEIS_API_KEY, KAKAO_REST_KEY, CLOUDFLARE_API_TOKEN (D1 Edit), CLOUDFLARE_ACCOUNT_ID.
on:
  schedule:
    - cron: '47 18 * * *' # 03:47 KST
  workflow_dispatch:
    inputs:
      minutes:
        description: '좌표 변환 시간(분), 최대 280'
        default: '280'
permissions:
  contents: write
concurrency:
  group: academy-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - uses: actions/cache/restore@v4
        with:
          path: runtime/academy
          key: academy-${{ github.run_id }}
          restore-keys: academy-
      - name: Collect
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/collect-academy.py --minutes ${{ inputs.minutes || '280' }}
      - name: Load D1 (new and changed rows)
        run: node scripts/build-academy-d1.mjs runtime/academy/full.json --remote --manifest runtime/academy/d1-manifest.json
      - uses: actions/cache/save@v4
        if: always() && hashFiles('runtime/academy/geo.json') != ''
        with:
          path: runtime/academy
          key: academy-${{ github.run_id }}
      - name: Commit build file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/academy/data/summary.json
          if git diff --cached --quiet; then echo 'no change'; exit 0; fi
          git commit -m 'academy: 학원 요약 데이터 갱신'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
