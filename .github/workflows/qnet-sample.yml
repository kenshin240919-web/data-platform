name: Q-net sample
# 국가자격 시험일정·시험장소 API 표본(scripts/qnet-sample.py) → reports/job/qnet-sample.md. 11/3 사용자 활용신청.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/qnet-sample.py']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/qnet-sample.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/job/qnet-sample.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '국가자격 시험일정·시험장 표본'
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
