name: Stock deploy
# Deploys stock.guidejung.com (Worker guidejung-stock) with wrangler from GitHub Actions. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# 수집 없음(재고는 방문 때 공개 중계에서 조회, 저장 안 함). 11/10 사용자 승인으로 첫 배포·도메인 연결.
on:
  push:
    branches: [main]
    paths:
      - 'apps/stock/**'
      - 'apps/weather/data/regions.json'
      - 'packages/**'
      - 'scripts/prune-rsc.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/stock/wrangler.jsonc
