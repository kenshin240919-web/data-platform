name: Stock deploy
# Deploys stock.guidejung.com (Worker guidejung-stock) with wrangler from GitHub Actions. Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# 수집 없음(재고는 방문 때 공개 중계에서 조회, 저장 안 함). 첫 배포·도메인 연결은 사용자 승인 뒤(CLAUDE.md) — 승인 전에는 수동 실행만.
# 승인 뒤 push(apps/stock/**·apps/weather/data/**·packages/** 등)를 movie-deploy.yml처럼 넣을 것.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build and deploy
        run: npx wrangler deploy -c apps/stock/wrangler.jsonc
